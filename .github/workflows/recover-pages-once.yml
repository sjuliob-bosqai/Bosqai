name: BOSQAI · One-time Pages recovery
on:
  push:
    paths:
      - '.github/workflows/recover-pages-once.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck GitHub Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          code=$(curl --silent --show-error --output /tmp/pages-cancel-response --write-out "%{http_code}" --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/sjuliob-bosqai/Bosqai/pages/deployments/dea30d4f106df12d04add89fd93707538f5cccd3/cancel")
          if [[ "$code" == "204" ]]; then
            echo "Pages deployment cancellation accepted (HTTP 204)."
          elif [[ "$code" == "404" ]]; then
            echo "Stale Pages deployment no longer exists (HTTP 404)."
          else
            echo "::error::Pages deployment cancellation failed with HTTP $code"
            cat /tmp/pages-cancel-response
            exit 1
          fi
