name: Validate and publish BOSQAI Arch-Core
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check data.js
          node --check sw.js
          node --check deep.js
          node --check visual-data.js
          node --check research.js
          node --check chapters.js
          node --check chapters-view.js
          node --check compare.js
          node --check dossier-pro.js
          node -e "global.window={}; require('./deep.js'); require('./chapters.js'); if(window.BOSQAI_DEEP.toc.length!==30 || window.BOSQAI_DEEP.sources.length!==15 || window.BOSQAI_CHAPTERS.tratado.length!==21 || window.BOSQAI_CHAPTERS.atlas.length!==13) process.exit(1); console.log('Source registry and chapters validated');"
          node -e "global.window={}; require('./visual-data.js'); let b=Buffer.from(window.BOSQAI_VISUAL.src.split(',')[1],'base64'); if (b.length<4000 || b.subarray(0,4).toString()!=='RIFF') process.exit(1); console.log('PDF atlas bytes:',b.length)"
          test -f index.html
          test -f biblioteca/acy-2020.html
          test -f biblioteca/acy-2021.html
          test -f biblioteca/acy-2022.html
          test -f research.css
          test -f deep.js
          test -f visual-data.js
          test -f research.js
          test -f chapters.js
          test -f chapters-view.js
          test -f compare.js
          test -f dossier-pro.js
          test -f dossier-pro.css
          test -f PROCEDENCIA_VISUAL_Y_LICENCIAS.md
          grep -q "BOSQAI_DEEP" deep.js
          grep -q 'Julián Osorno Arboleda' app.js
          grep -q 'Sebastián Julio Bedoya' app.js
          node -e "global.window={}; require('./data.js'); const d=window.BOSQAI_DATA; if(d.books.length!==3 || d.books.some(b=>b.cases.length<6)) process.exit(1); console.log('ACY fichas:',d.books.reduce((n,b)=>n+b.cases.length,0))"
      - name: Prepare public artifact only
        run: |
          mkdir -p _site/biblioteca _site/assets
          cp index.html style.css research.css dossier-pro.css data.js deep.js chapters.js visual-data.js app.js research.js chapters-view.js compare.js dossier-pro.js sw.js manifest.webmanifest .nojekyll _site/
          cp biblioteca/acy-20*.html _site/biblioteca/
          cp assets/favicon.svg _site/assets/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
